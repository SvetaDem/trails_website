  <path d="M590 630c-80-90 130-120 60-200S480 330 540 260c12-15 26-24 42-31" fill="none" stroke="#FBF7E8" stroke-width="13" stroke-linecap="round" stroke-dasharray="16 14"/>

  <!-- указатель -->
  <g transform="translate(582 225)">
    <circle r="34" fill="#fff" opacity=".35"/>
    <path d="M0 12c-15-17-22-29-22-41a22 22 0 1 1 44 0c0 12-7 24-22 41Z" fill="#2E7D32" stroke="#fff" stroke-width="4"/>
    <circle cy="-29" r="8" fill="#fff"/>
  </g>

