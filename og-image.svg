<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F1E0"/>
      <stop offset="1" stop-color="#FAF9F6"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E8C42"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- солнце -->
  <circle cx="985" cy="150" r="52" fill="#F2D06B"/>
  <circle cx="985" cy="150" r="82" fill="#F2D06B" opacity=".18"/>

  <!-- холмы -->
  <path d="M0 420Q280 300 560 400T1200 360V630H0Z" fill="#CFE0C0"/>
  <path d="M0 505Q340 380 640 470T1200 440V630H0Z" fill="#A5C795"/>
  <path d="M0 580Q420 470 780 550T1200 540V630H0Z" fill="url(#hillFront)"/>

