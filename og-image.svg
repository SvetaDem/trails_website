  <g transform="translate(90 118)">
    <rect width="72" height="72" rx="20" fill="#2E7D32"/>
    <path d="M20 58c0-13 16-13 16-27S26 14 31 12" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8" fill="none"/>
    <path d="M46 60c-2-10 3-18 13-24-3 13-5 19-13 24Z" fill="#fff"/>
    <text x="96" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="58" font-weight="800" fill="#1B5E20">Тропы</text>
  </g>

  <!-- заголовок -->
  <text x="90" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="45" font-weight="700" fill="#212121">Проверенные пешие маршруты</text>
  <text x="90" y="325" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="45" font-weight="700" fill="#212121">и экотропы рядом с домом</text>

  <!-- подзаголовок -->
  <text x="90" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="27" fill="#565B54">Карты PDF · координаты старта · описания достопримечательностей · отзывы</text>

  <!-- плашка -->
  <rect x="90" y="440" width="420" height="58" rx="29" fill="#2E7D32"/>
  <circle cx="120" cy="469" r="7" fill="#fff" opacity=".9"/>
  <text x="140" y="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="600" fill="#fff">Сезон открыт · маршруты проверены</text>
